<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>مقارنة الأعشاب - موسوعة الأعشاب الطبية</title>
    <meta name="theme-color" content="#2e7d32">
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* تنسيقات إضافية لصفحة المقارنة */
        .compare-page-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .compare-header-section {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 20px 24px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .compare-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .compare-title i {
            font-size: 28px;
            color: var(--primary);
        }

        .compare-title h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .compare-title p {
            font-size: 13px;
            color: var(--text-tertiary);
            margin-top: 4px;
        }

        .compare-actions-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .compare-action-btn {
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition-fast);
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .compare-action-btn.primary {
            background: var(--primary);
            color: white;
        }

        .compare-action-btn.secondary {
            background: var(--bg-sidebar);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .compare-action-btn.danger {
            background: var(--danger);
            color: white;
        }

        .compare-action-btn:active {
            transform: scale(0.96);
        }

        /* حالة عدم وجود أعشاب */
        .empty-compare {
            text-align: center;
            padding: 60px 20px;
            background: var(--bg-card);
            border-radius: 24px;
            border: 1px solid var(--border);
        }

        .empty-compare i {
            font-size: 64px;
            color: var(--text-tertiary);
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-compare h3 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .empty-compare p {
            color: var(--text-tertiary);
            margin-bottom: 24px;
        }

        /* جدول المقارنة */
        .compare-table-wrapper {
            overflow-x: auto;
            background: var(--bg-card);
            border-radius: 24px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .compare-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }

        .compare-table th {
            background: var(--primary);
            color: white;
            padding: 16px;
            font-weight: 600;
            font-size: 15px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .compare-table td {
            padding: 14px 16px;
            border: 1px solid var(--border);
            vertical-align: top;
            background: var(--bg-card);
        }

        .compare-table .compare-label {
            background: var(--bg-sidebar);
            font-weight: 600;
            width: 140px;
            color: var(--text-primary);
        }

        .compare-table .compare-value {
            color: var(--text-secondary);
            line-height: 1.6;
        }

        /* رأس كل عشبة */
        .compare-herb-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            text-align: center;
        }

        .compare-herb-image {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 8px;
        }

        .compare-herb-name {
            font-size: 16px;
            font-weight: 700;
        }

        .compare-remove-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 11px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 4px;
        }

        .compare-remove-btn:hover {
            background: var(--danger);
        }

        /* أزرار التحكم */
        .compare-controls {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        /* إشعار */
        .toast-compare {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary);
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 13px;
            z-index: 1000;
            animation: fadeInUp 0.3s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* مؤشر التحميل */
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px;
            gap: 12px;
        }

        .loading-spinner i {
            font-size: 32px;
            color: var(--primary);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .compare-page-container { padding: 12px; }
            .compare-header-section { flex-direction: column; text-align: center; }
            .compare-table th, .compare-table td { padding: 10px; font-size: 13px; }
            .compare-table .compare-label { width: 100px; }
            .compare-herb-image { width: 60px; height: 60px; }
        }
    </style>
</head>
<body>
    <div class="compare-page-container">
        <!-- رأس الصفحة -->
        <div class="compare-header-section">
            <div class="compare-title">
                <i class="fas fa-balance-scale"></i>
                <div>
                    <h1>مقارنة الأعشاب</h1>
                    <p>قارن بين الأعشاب من حيث الفوائد والتحذيرات والأضرار</p>
                </div>
            </div>
            <div class="compare-actions-bar">
                <button class="compare-action-btn secondary" id="backToAppBtn">
                    <i class="fas fa-arrow-right"></i> العودة للتطبيق
                </button>
                <button class="compare-action-btn primary" id="printCompareBtn">
                    <i class="fas fa-print"></i> طباعة
                </button>
                <button class="compare-action-btn danger" id="clearCompareBtn">
                    <i class="fas fa-trash-alt"></i> مسح الكل
                </button>
            </div>
        </div>

        <!-- محتوى المقارنة -->
        <div id="compareContent">
            <div class="loading-spinner">
                <i class="fas fa-spinner"></i>
                <span>جاري تحميل البيانات...</span>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js"></script>

    <script>
        // دوال مساعدة
        function escapeHtml(s) {
            if (!s) return '—';
            return s.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
        }

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = 'toast-compare';
            toast.style.background = type === 'success' ? '#4caf50' : type === 'error' ? '#f44336' : type === 'warning' ? '#ff9800' : '#2e7d32';
            toast.innerHTML = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // تحميل البيانات مباشرة من Firebase
        async function loadData() {
            const container = document.getElementById('compareContent');
            container.innerHTML = '<div class="loading-spinner"><i class="fas fa-spinner"></i><span>جاري تحميل البيانات...</span></div>';
            
            try {
                // جلب التصنيفات
                const categoriesSnapshot = await db.collection('categories').orderBy('name').get();
                const categories = categoriesSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                
                // جلب الأعشاب
                const herbsSnapshot = await db.collection('herbs').get();
                const herbs = herbsSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                
                window.appState = window.appState || {};
                window.appState.categories = categories;
                window.appState.herbs = herbs;
                
                renderComparePage();
            } catch (error) {
                console.error('فشل تحميل البيانات:', error);
                container.innerHTML = `
                    <div class="empty-compare">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h3>خطأ في تحميل البيانات</h3>
                        <p>يرجى التحقق من اتصالك بالإنترنت</p>
                        <button class="compare-action-btn primary" onclick="location.reload()">
                            <i class="fas fa-sync-alt"></i> إعادة المحاولة
                        </button>
                        <button class="compare-action-btn secondary" id="backHomeBtn">
                            <i class="fas fa-home"></i> العودة للرئيسية
                        </button>
                    </div>
                `;
                const backHomeBtn = document.getElementById('backHomeBtn');
                if (backHomeBtn) {
                    backHomeBtn.addEventListener('click', () => window.location.href = './');
                }
            }
        }

        // عرض صفحة المقارنة
        function renderComparePage() {
            const compareList = JSON.parse(localStorage.getItem('herbal_compare_list') || '[]');
            const container = document.getElementById('compareContent');
            
            if (compareList.length === 0) {
                container.innerHTML = `
                    <div class="empty-compare">
                        <i class="fas fa-balance-scale"></i>
                        <h3>لا توجد أعشاب للمقارنة</h3>
                        <p>أضف عشبتين على الأقل من صفحة تفاصيل العشبة</p>
                        <button class="compare-action-btn primary" id="goToAppBtn">
                            <i class="fas fa-home"></i> الذهاب إلى التطبيق
                        </button>
                    </div>
                `;
                const goToAppBtn = document.getElementById('goToAppBtn');
                if (goToAppBtn) {
                    goToAppBtn.addEventListener('click', () => window.location.href = './');
                }
                return;
            }

            if (compareList.length === 1) {
                container.innerHTML = `
                    <div class="empty-compare">
                        <i class="fas fa-balance-scale"></i>
                        <h3>بحاجة إلى عشبة أخرى للمقارنة</h3>
                        <p>أضف عشبة أخرى من صفحة تفاصيل العشبة</p>
                        <button class="compare-action-btn primary" id="goToAppBtn">
                            <i class="fas fa-home"></i> الذهاب إلى التطبيق
                        </button>
                    </div>
                `;
                const goToAppBtn = document.getElementById('goToAppBtn');
                if (goToAppBtn) {
                    goToAppBtn.addEventListener('click', () => window.location.href = './');
                }
                return;
            }

            // بناء جدول المقارنة
            let html = `
                <div class="compare-table-wrapper">
                    <table class="compare-table">
                        <thead>
                            <tr>
                                <th>الميزة</th>
                                ${compareList.map(herb => `
                                    <th>
                                        <div class="compare-herb-header">
                                            ${herb.image_url ? `<img src="${escapeHtml(herb.image_url)}" class="compare-herb-image" onerror="this.style.display='none'">` : '<div style="width:80px;height:80px;background:var(--bg-sidebar);border-radius:16px;display:flex;align-items:center;justify-content:center;"><i class="fas fa-leaf" style="font-size:32px;color:var(--text-tertiary);"></i></div>'}
                                            <span class="compare-herb-name">🌿 ${escapeHtml(herb.name)}</span>
                                            <button class="compare-remove-btn" onclick="removeFromCompare('${herb.id}')">
                                                <i class="fas fa-times"></i> إزالة
                                            </button>
                                        </div>
                                    </th>
                                `).join('')}
                            </tr>
                        </thead>
                        <tbody>
            `;

            const fields = [
                { label: '💚 الفوائد الصحية', key: 'benefits', icon: 'fa-heartbeat' },
                { label: '⚠️ التحذيرات الهامة', key: 'warnings', icon: 'fa-exclamation-triangle' },
                { label: '⚡ الأضرار المحتملة', key: 'harms', icon: 'fa-skull-crosswalk' },
                { label: '🍵 طريقة الاستخدام والجرعات', key: 'usage', icon: 'fa-mug-hot' },
                { label: '📝 ملاحظات إضافية', key: 'notes', icon: 'fa-sticky-note' }
            ];

            for (const field of fields) {
                html += `
                    <tr>
                        <td class="compare-label">
                            <i class="fas ${field.icon}"></i> ${field.label}
                        </td>
                        ${compareList.map(herb => `
                            <td class="compare-value">
                                ${escapeHtml(herb[field.key] || '—')}
                            </td>
                        `).join('')}
                    </tr>
                `;
            }

            // إضافة صف الصور إذا وجدت
            if (compareList.some(h => h.image_url)) {
                html += `
                    <tr>
                        <td class="compare-label"><i class="fas fa-image"></i> صورة العشبة</td>
                        ${compareList.map(herb => `
                            <td class="compare-value">
                                ${herb.image_url ? `<img src="${escapeHtml(herb.image_url)}" class="compare-herb-image" style="width:60px;height:60px;object-fit:cover;border-radius:12px;cursor:pointer;" onclick="window.open('${escapeHtml(herb.image_url)}', '_blank')">` : '—'}
                            </td>
                        `).join('')}
                    </tr>
                `;
            }

            html += `
                        </tbody>
                    </table>
                </div>
                <div class="compare-controls">
                    <button class="compare-action-btn secondary" id="addMoreBtn">
                        <i class="fas fa-plus-circle"></i> إضافة عشبة أخرى
                    </button>
                    <button class="compare-action-btn primary" id="printTableBtn">
                        <i class="fas fa-print"></i> طباعة الجدول
                    </button>
                    <button class="compare-action-btn danger" id="clearTableBtn">
                        <i class="fas fa-trash-alt"></i> مسح القائمة
                    </button>
                </div>
            `;

            container.innerHTML = html;

            // ربط الأحداث
            document.getElementById('addMoreBtn')?.addEventListener('click', () => window.location.href = './');
            document.getElementById('printTableBtn')?.addEventListener('click', () => printCompareTable(compareList));
            document.getElementById('clearTableBtn')?.addEventListener('click', () => {
                if (confirm('⚠️ هل تريد مسح جميع الأعشاب من قائمة المقارنة؟')) {
                    localStorage.removeItem('herbal_compare_list');
                    renderComparePage();
                    showToast('✅ تم مسح قائمة المقارنة', 'success');
                }
            });
        }

        // إزالة عشبة من المقارنة
        function removeFromCompare(herbId) {
            let compareList = JSON.parse(localStorage.getItem('herbal_compare_list') || '[]');
            compareList = compareList.filter(h => h.id !== herbId);
            localStorage.setItem('herbal_compare_list', JSON.stringify(compareList));
            showToast('🗑️ تم إزالة العشبة من المقارنة', 'info');
            renderComparePage();
        }

        // طباعة جدول المقارنة
        function printCompareTable(compareList) {
            const printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <!DOCTYPE html>
                <html dir="rtl">
                <head>
                    <meta charset="UTF-8">
                    <title>مقارنة الأعشاب - موسوعة الأعشاب الطبية</title>
                    <style>
                        body { font-family: 'Cairo', sans-serif; padding: 30px; max-width: 1200px; margin: 0 auto; }
                        h1 { color: #2e7d32; text-align: center; margin-bottom: 10px; }
                        .date { text-align: center; color: #666; margin-bottom: 30px; font-size: 12px; }
                        table { width: 100%; border-collapse: collapse; }
                        th, td { border: 1px solid #ddd; padding: 12px; text-align: right; vertical-align: top; }
                        th { background: #2e7d32; color: white; }
                        td:first-child { background: #f5f5f5; font-weight: bold; width: 150px; }
                        .herb-image { max-width: 80px; border-radius: 10px; display: block; margin-bottom: 10px; }
                        .footer { text-align: center; margin-top: 30px; font-size: 11px; color: #999; border-top: 1px solid #ddd; padding-top: 20px; }
                        @media print { button { display: none; } }
                    </style>
                </head>
                <body>
                    <h1>🌿 مقارنة الأعشاب الطبية</h1>
                    <div class="date">تاريخ الطباعة: ${new Date().toLocaleString('ar-EG')}</div>
                    <table>
                        <thead>
                            <tr><th>الميزة</th>${compareList.map(h => `<th>${escapeHtml(h.name)}</th>`).join('')}</tr>
                        </thead>
                        <tbody>
            `);
            
            const printFields = [
                { label: 'الفوائد الصحية', key: 'benefits' },
                { label: 'التحذيرات', key: 'warnings' },
                { label: 'الأضرار', key: 'harms' },
                { label: 'طريقة الاستخدام', key: 'usage' },
                { label: 'ملاحظات', key: 'notes' }
            ];
            
            for (const field of printFields) {
                printWindow.document.write(`
                    <tr><td><strong>${field.label}</strong></td>${compareList.map(h => `<td>${escapeHtml(h[field.key] || '—')}</td>`).join('')}</tr>
                `);
            }
            
            if (compareList.some(h => h.image_url)) {
                printWindow.document.write(`<tr><td><strong>صورة العشبة</strong></td>${compareList.map(h => `<td>${h.image_url ? `<img src="${h.image_url}" class="herb-image" style="max-width:100px;">` : '—'}</td>`).join('')}</tr>`);
            }
            
            printWindow.document.write(`
                        </tbody>
                    </table>
                    <div class="footer">موسوعة الأعشاب الطبية - نظام المقارنة المتقدم</div>
                </body>
                </html>
            `);
            printWindow.document.close();
            printWindow.print();
        }

        // ربط الأزرار
        document.getElementById('backToAppBtn')?.addEventListener('click', () => window.location.href = './');
        document.getElementById('printCompareBtn')?.addEventListener('click', () => {
            const compareList = JSON.parse(localStorage.getItem('herbal_compare_list') || '[]');
            if (compareList.length >= 2) {
                printCompareTable(compareList);
            } else {
                showToast('⚠️ لا توجد أعشاب كافية للطباعة', 'warning');
            }
        });
        document.getElementById('clearCompareBtn')?.addEventListener('click', () => {
            if (confirm('⚠️ هل تريد مسح جميع الأعشاب من قائمة المقارنة؟')) {
                localStorage.removeItem('herbal_compare_list');
                renderComparePage();
                showToast('✅ تم مسح قائمة المقارنة', 'success');
            }
        });

        // بدء التحميل
        loadData();
    </script>
</body>
</html>
